<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>건물 표현 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#3182f6;--ink:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#f2f4f6;--bg:#f9fafb}
*{box-sizing:border-box;margin:0}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0}
.card{position:fixed;left:28px;top:28px;bottom:28px;width:360px;background:#fff;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,.08);padding:28px 26px;display:flex;flex-direction:column}
.addr{display:inline-flex;align-items:center;gap:6px;background:var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sub);font-weight:600;align-self:flex-start}
.big{margin-top:26px;font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-.5px}
.big em{font-style:normal;color:var(--blue)}.big em.red{color:#f04452}.row.bad .n,.row.bad .v{color:#f04452}
.lead{margin-top:8px;font-size:16px;color:var(--sub)}
.rows{margin-top:28px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-size:16px;color:var(--sub)}
.row .v{font-size:17px;font-weight:700}
.row .v small{display:block;text-align:right;font-size:13px;color:var(--mute);font-weight:500;margin-top:2px}
.more{margin-top:6px;font-size:15px;color:var(--mute);font-weight:600}
.btn{margin-top:auto;background:var(--blue);color:#fff;border:0;border-radius:16px;height:56px;font:700 17px Pretendard,'Malgun Gothic',sans-serif}
.btn2{margin-top:10px;background:var(--line);color:var(--sub);border:0;border-radius:16px;height:50px;font:600 16px Pretendard,'Malgun Gothic',sans-serif}
.seg{position:fixed;right:28px;top:28px;background:#fff;border-radius:14px;padding:4px;display:flex;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.seg span{padding:9px 16px;border-radius:10px;font-size:15px;font-weight:600;color:var(--mute)}
.seg .on{background:var(--ink);color:#fff}
.tag{position:fixed;left:416px;top:28px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700}
.tag small{font-weight:500;opacity:.7;margin-left:8px}
.lab{font-family:Pretendard,'Malgun Gothic',sans-serif;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lab.p{background:#ff6b6b;color:#fff}
.lab.y{background:#ffb020;color:#fff}
.lab.m{background:var(--blue);color:#fff}
.lab.e{background:none;box-shadow:none;font-size:12px;color:var(--sub);padding:0;text-shadow:0 0 4px #fff,0 0 4px #fff}
.osm{position:fixed;right:28px;bottom:20px;font-size:12px;color:var(--mute)}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js"}}</script>
</head><body>
<div id="view"></div>
<div class="card">
  <span class="addr">서울 강동구 천호대로 · 저장식 3,000㎥</span>
  <div class="big">이 자리에<br><em>설치할 수 있어요</em></div>
  <div class="lead">안전거리 기준 7가지를 모두 통과했어요</div>
  <div class="rows">
    <div class="row"><span class="n">학교·아파트까지</span><span class="v">221m<small>기준 17m</small></span></div>
    <div class="row"><span class="n">저장설비와 충전기</span><span class="v">8.8m<small>기준 8m</small></span></div>
    <div class="row"><span class="n">충전기와 도로</span><span class="v">13.6m<small>기준 5m</small></span></div>
  </div>
  <div class="more">4가지 더 보기 ›</div>
  <button class="btn">신청서에 넣기</button>
  <button class="btn2">배치도 올리기</button>
</div>
<div class="seg"><span class="on">부지</span><span>주변</span><span>위에서</span></div>
<div class="tag" id="tag"></div>
<div class="osm">지도 © OpenStreetMap</div>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from '/vendor/three/CSS2DRenderer.js';
const Q = new URLSearchParams(location.search), STY = Q.get('s') || 'A';
const NAMES = {A: ['시안 A', '흰색 건축 모형'], B: ['시안 B', '반투명 유리 + 보호시설만 색'], C: ['시안 C', '납작한 지도 + 우리 부지만 입체']};
document.getElementById('tag').innerHTML = `${NAMES[STY][0]}<small>${NAMES[STY][1]}</small>`;
const st = await fetch('state_city.json').then(r => r.json()), S = st.S;
document.querySelector('.addr').textContent = '서울 중구 세종대로 일대 · 저장식 3,000㎥';
document.querySelector('.big').innerHTML = '거의 다 됐어요<br><em class="red">1곳만 고치면 돼요</em>';
document.querySelector('.lead').textContent = '안전거리 기준 8가지 중 7가지 통과';
document.querySelector('.rows').innerHTML = `
 <div class="row bad"><span class="n">철도까지</span><span class="v">7.7m<small>기준 30m</small></span></div>
 <div class="row"><span class="n">서울특별시청까지</span><span class="v">29m<small>기준 17m</small></span></div>
 <div class="row"><span class="n">저장설비와 충전기</span><span class="v">8.9m<small>기준 8m</small></span></div>`;
document.querySelector('.more').textContent = '5가지 더 보기 ›';
document.querySelector('.btn').textContent = 'AI에게 고쳐 달라고 하기';
const site = st.site, L = st.L, M = st.m.lines;
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(1.5); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const lab = new CSS2DRenderer(); lab.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none'; view.appendChild(lab.domElement);
const scene = new THREE.Scene();
const BG = {A: 0xf2f4f6, B: 0xeef2f7, C: 0xf4f5f7}[STY]; scene.background = new THREE.Color(BG); scene.fog = new THREE.Fog(BG, 420, 900);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 4000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd5dbe3, STY === 'A' ? 2.2 : 1.9));
const sun = new THREE.DirectionalLight(0xffffff, STY === 'A' ? 1.3 : 1.1); sun.position.set(-160, 260, 120); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -400, right: 400, top: 400, bottom: -400, far: 1000}); sun.shadow.bias = -0.0005; scene.add(sun);
const V = (x, y, h = 0) => new THREE.Vector3(x, h, -y);
const local2w = (x, y) => { const a = site.ang * Math.PI / 180; return [site.cx + x * Math.cos(a) - y * Math.sin(a), site.cy + x * Math.sin(a) + y * Math.cos(a)]; };
const rect = (cx, cy, w, d) => [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => local2w(cx + sx * w / 2, cy + sy * d / 2));
const shape = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); return s; };
const cen = pts => pts.reduce((s, p) => [s[0] + p[0] / pts.length, s[1] + p[1] / pts.length], [0, 0]);
function flat(pts, color, h, op = 1) { const g = new THREE.ShapeGeometry(shape(pts)); g.rotateX(-Math.PI / 2); const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color, transparent: op < 1, opacity: op})); m.position.y = h; m.receiveShadow = true; return m; }
function ribbon(pts, w, color, h) {
  const pos = [];
  for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2;
    const q = [[a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]].map(([x, y]) => [x, h, -y]); pos.push(...q[0], ...q[1], ...q[2], ...q[0], ...q[2], ...q[3]); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color, side: THREE.DoubleSide})); m.receiveShadow = true; return m;
}
function solid(pts, h, color, o = {}) {
  const g = new THREE.ExtrudeGeometry(shape(pts), {depth: h, bevelEnabled: false}); g.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshLambertMaterial({color, transparent: o.op < 1, opacity: o.op ?? 1, depthWrite: !(o.op < 1)});
  const m = new THREE.Mesh(g, mat); m.castShadow = !(o.op < 1); m.receiveShadow = true;
  const grp = new THREE.Group(); grp.add(m);
  if (o.edge) grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({color: o.edge, transparent: true, opacity: o.eop ?? 1})));
  return grp;
}
function label(text, cls, x, y, h) { const d = document.createElement('div'); d.className = 'lab ' + cls; d.textContent = text; const o = new CSS2DObject(d); o.position.copy(V(x, y, h)); scene.add(o); }

// 바닥·길
{ const gm = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({color: BG})); gm.rotation.x = -Math.PI / 2; gm.receiveShadow = true; scene.add(gm); }
for (const z of S.zones) if (/park|pitch|grass|garden/.test(z.kind) || z.cls === 1) scene.add(flat(z.pts, z.cls === 1 ? (STY === 'C' ? 0xffe3e3 : 0xfbe9e9) : 0xe3f1e0, 0.03));
for (const r of S.roads) { const foot = /foot|cycle|path|steps|pedestrian|track/.test(r.kind); if (foot) continue; scene.add(ribbon(r.pts, r.w, 0xffffff, r.road_law ? 0.08 : 0.06)); }

for (const r of S.rails) scene.add(ribbon(r.pts, 2.5, 0xb0b8c1, 0.1));
// 주변 건물: 시안별 표현
const PC = {1: 0xff8a8a, 2: 0xffc864};
// 표시할 보호시설: 부지에서 가까운 것 몇 개만 색칠(나머지는 배경)
const near = d => Math.hypot(cen(d.pts)[0] - site.cx, cen(d.pts)[1] - site.cy);
const HOT = new Set(S.buildings.filter(b => b.cls > 0).sort((x, y) => near(x) - near(y)).slice(0, 4));
for (const b of S.buildings) {
  const h = b.h, c = HOT.has(b) ? b.cls : 0;
  if (STY === 'A') {
    scene.add(solid(b.pts, h, 0xffffff, {edge: 0xd9dee5, eop: .8}));
    if (c) { const cap = flat(b.pts, PC[c], h + 0.06); scene.add(cap); }
  } else if (STY === 'B') {
    if (c) scene.add(solid(b.pts, h, PC[c], {edge: c === 1 ? 0xe55a5a : 0xe0a030, eop: .9}));
    else scene.add(solid(b.pts, h, 0xc9d3df, {op: .28, edge: 0x9aa8b8, eop: .7}));
  } else {
    const hh = Math.min(3.5, 1 + h * 0.05);
    scene.add(solid(b.pts, hh, c ? PC[c] : 0xdde2e8, {edge: c ? 0xffffff : 0xffffff, eop: .9}));
  }
}
const nearest = [...HOT].filter(b => b.name).map(b => ({b, p: cen(b.pts)})).map(o => ({...o, d: Math.hypot(o.p[0] - site.cx, o.p[1] - site.cy)})).sort((x, y) => x.d - y.d).slice(0, 3);
for (const o of nearest) label(o.b.name, 'p', o.p[0], o.p[1], (STY === 'C' ? 4 : o.b.h) + 4);


// 우리 부지·설비
scene.add(flat(rect(0, 0, site.w, site.d), 0xe8f3ff, 0.12));
const sl = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(rect(0, 0, site.w, site.d).map(p => V(p[0], p[1], 0.18))), new THREE.LineBasicMaterial({color: 0x3182f6})); scene.add(sl);
const EC = {process: 0xffd43b, compressed: 0xff922b, storage: 0x4dabf7, charger: 0x51cf66, building: 0xffffff, other: 0xced4da};
const EH = {process: 3, compressed: 3.5, storage: 3.2, charger: 2.4, building: 4.5, other: 2};
const SHORT = {'튜브트레일러(저장설비)': '저장설비'};
for (const it of L.items) {
  scene.add(solid(rect(it.cx, it.cy, it.w, it.d), EH[it.type] || 2, EC[it.type] || 0xced4da, {edge: 0xffffff, eop: .9}));
  if (['storage', 'charger', 'process'].includes(it.type) && !/프리쿨러/.test(it.name)) { const p = local2w(it.cx, it.cy); label(SHORT[it.name] || it.name.replace(/\(.*\)/, ''), 'e', p[0], p[1], (EH[it.type] || 2) + 2.2); }
}
for (const w of L.walls || []) {
  const a = local2w(w.x1, w.y1), b = local2w(w.x2, w.y2), len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const box = new THREE.Mesh(new THREE.BoxGeometry(len, 2, 0.3), new THREE.MeshLambertMaterial({color: 0x8b95a1})); box.position.copy(V((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 1)); box.rotation.y = Math.atan2(b[1] - a[1], b[0] - a[0]); box.castShadow = true; scene.add(box);
}
// 가장 가까운 보호시설까지 선 하나만
const p1 = M.p1, ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(p1.a[0], p1.a[1], 1.5), V(p1.b[0], p1.b[1], 1.5)]), new THREE.LineDashedMaterial({color: 0x3182f6, dashSize: 4, gapSize: 3, linewidth: 2}));
ln.computeLineDistances(); scene.add(ln);
label(`${Math.round(p1.d)}m`, 'm', (p1.a[0] + p1.b[0]) / 2, (p1.a[1] + p1.b[1]) / 2, 3);
let rl = null; { const sp = []; const R = rect(0, 0, site.w, site.d); for (let i = 0; i < 4; i++) for (let t = 0; t <= 1; t += 0.05) sp.push([R[i][0] + (R[(i + 1) % 4][0] - R[i][0]) * t, R[i][1] + (R[(i + 1) % 4][1] - R[i][1]) * t]);
  for (const r of S.rails) for (let j = 0; j < r.pts.length - 1; j++) { const A = r.pts[j], B = r.pts[j + 1], ex = B[0] - A[0], ey = B[1] - A[1], ll = ex * ex + ey * ey || 1;
    for (const q of sp) { const u = Math.max(0, Math.min(1, ((q[0] - A[0]) * ex + (q[1] - A[1]) * ey) / ll)), c = [A[0] + ex * u, A[1] + ey * u], d = Math.hypot(q[0] - c[0], q[1] - c[1]); if (!rl || d < rl.d) rl = {d, a: q, b: c}; } } } if (rl && rl.a) { const l2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(rl.a[0], rl.a[1], 1.5), V(rl.b[0], rl.b[1], 1.5)]), new THREE.LineBasicMaterial({color: 0xf04452})); scene.add(l2); label(`철도 ${st.m.inputs.d_rail}m`, 'p', (rl.a[0] + rl.b[0]) / 2, (rl.a[1] + rl.b[1]) / 2, 3); }
const sc = M.sc; if (sc && sc.a) { scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(sc.a[0], sc.a[1], 3.6), V(sc.b[0], sc.b[1], 3.6)]), new THREE.LineBasicMaterial({color: 0x3182f6}))); }

// 카메라: 도로 쪽 비스듬히 위에서
const an = site.ang * Math.PI / 180, fw = [-Math.sin(an), Math.cos(an)];   // 부지 +y 방향
const tgt = V(site.cx + fw[0] * 30, site.cy + fw[1] * 30, 0);
const cp = [site.cx - fw[0] * 250 + Math.cos(an) * 110, site.cy - fw[1] * 250 + Math.sin(an) * 110];
camera.position.copy(V(cp[0], cp[1], 260)); camera.lookAt(tgt);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); lab.setSize(w, h); camera.aspect = w / h; camera.setViewOffset(w, h, -190, 0, w, h); camera.updateProjectionMatrix(); }
resize(); addEventListener('resize', resize);
let n = 0; (function loop() { renderer.render(scene, camera); lab.render(scene, camera); if (++n === 8) document.body.dataset.ready = '1'; requestAnimationFrame(loop); })();
</script>
</body></html>

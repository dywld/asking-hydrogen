<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AI 신청서 채우기 시안</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2f4f6;font:15px/1.5 "Malgun Gothic",system-ui,sans-serif;color:#191f28;padding:26px 0 40px;width:900px}
.lab{position:fixed;top:0;left:0;right:0;background:#191f28;color:#fff;font-weight:700;padding:8px 24px;font-size:14px;z-index:9}
.card{width:780px;margin:22px auto 0;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:20px 24px 24px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:52px}
.hd .t{flex:1}.hd b{font-size:18px;display:block}.hd small{color:#8b95a1}
.go{border:0;border-radius:14px;padding:13px 20px;font:700 15.5px "Malgun Gothic";color:#fff;background:linear-gradient(90deg,#3182f6,#7b5cff);box-shadow:0 6px 18px rgba(91,92,240,.35);display:flex;gap:8px;align-items:center}
.go img{width:26px;height:26px}
.band{display:none;align-items:center;gap:12px;flex:1;background:#e9f9f0;border:1px solid #bfeccf;border-radius:16px;padding:10px 16px}
.band .ck{width:34px;height:34px;border-radius:50%;background:#03a65a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.band b{font-size:16.5px}.band span{display:block;color:#4e5968;font-size:13px}
.prog{display:none;flex:1;align-items:center;gap:10px;font-weight:700;color:#5b5cf0}
.prog .bar{flex:1;height:6px;border-radius:6px;background:#eef0ff;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#3182f6,#7b5cff);width:0;transition:width .3s}
.pg{position:relative;width:732px;border:1px solid #e5e8eb;border-radius:6px;overflow:hidden}
.pg>img.bg{display:block;width:100%}
.f{position:absolute;border-radius:3px;background:rgba(49,130,246,.07);border:1px dashed rgba(49,130,246,.35);font-family:"Malgun Gothic";color:#1b2b6b;font-weight:600;display:flex;align-items:center;padding:0 4px;white-space:nowrap;overflow:visible;transition:background .3s,border-color .3s}
.f.on{background:rgba(49,130,246,.13);border:1.5px solid #3182f6;box-shadow:0 0 0 4px rgba(49,130,246,.18)}
.f.done{background:rgba(3,166,90,.10);border:1px solid rgba(3,166,90,.5)}
.f.flash{background:rgba(3,166,90,.22);border:1.5px solid #03a65a;box-shadow:0 0 0 5px rgba(3,166,90,.18)}
.f.need{background:#fff4e6;border:1.5px dashed #ff922b;color:#e8590c;justify-content:center;font-size:12px}
.f .car{display:inline-block;width:2px;height:1.1em;background:#3182f6;margin-left:1px;animation:bl .7s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.bot{position:absolute;width:58px;height:58px;z-index:5;transition:left .45s cubic-bezier(.5,1.6,.5,1),top .45s cubic-bezier(.5,1.6,.5,1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));display:none}
.bot img{width:100%}
.bub{position:absolute;z-index:6;background:#191f28;color:#fff;font:700 12.5px "Malgun Gothic";border-radius:10px;padding:6px 10px;white-space:nowrap;display:none;transition:left .45s,top .45s}
.bub.dn:after{left:16px;top:-6px;transform:none;border:6px solid transparent;border-bottom-color:#191f28;border-top:0}
.bub:after{content:"";position:absolute;left:-6px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-right-color:#191f28;border-left:0}
.bub em{font-style:normal;color:#8fd3ff}
</style></head><body><div class="lab" id="lab"></div>

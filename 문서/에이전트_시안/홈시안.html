<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>홈 화면 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#3182f6;--blue2:#e8f3ff;--ink:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#f2f4f6;--bg:#f9fafb;--green:#00b36b;--red:#f04452}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
.top{height:68px;display:flex;align-items:center;padding:0 32px;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center}
.top b{font-size:18px}
.top .sp{flex:1}
.top a{font-size:15px;color:var(--sub);font-weight:600;margin-left:22px}
.av{width:34px;height:34px;border-radius:50%;background:var(--line);margin-left:22px}
.tag{position:fixed;left:24px;bottom:20px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;z-index:9}
.tag small{font-weight:500;opacity:.7;margin-left:8px}
main{flex:1;overflow:hidden}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--blue2);color:var(--blue);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
.ask{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #e5e8eb;border-radius:20px;padding:10px 10px 10px 22px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.ask input{flex:1;border:0;outline:0;font:500 18px Pretendard,'Malgun Gothic';color:var(--ink)}
.ask input::placeholder{color:#b0b8c1}
.go{width:48px;height:48px;border-radius:14px;background:var(--blue);display:grid;place-items:center}
.go svg{width:22px;height:22px}
.clip{width:40px;height:40px;border-radius:12px;background:var(--line);display:grid;place-items:center}

/* A */
.A{max-width:1080px;margin:0 auto;padding:64px 32px 0}
.A h1{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.3;margin-top:18px}
.A .lead{font-size:18px;color:var(--sub);margin-top:10px}
.A .ask{margin-top:34px}
.A .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.A .c{border-radius:22px;background:var(--bg);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.A .c h3{font-size:19px;font-weight:700}
.A .c p{font-size:15px;color:var(--sub);line-height:1.5}
.A .c .steps{margin-top:auto;font-size:13px;color:var(--mute);font-weight:600}
.A .c.hl{background:var(--ink);color:#fff}.A .c.hl p{color:#c5cbd3}.A .c.hl .steps{color:#8b95a1}
.A .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid #e5e8eb;border-radius:999px;padding:10px 16px;font-size:15px;color:var(--sub);font-weight:600;background:#fff}

/* B */
.B{display:grid;grid-template-columns:1fr 1fr;height:100%}
.B .l{padding:80px 64px 0 96px}
.B h1{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.3;margin-top:20px}
.B .lead{font-size:18px;color:var(--sub);margin-top:12px;line-height:1.6}
.B .ask{margin-top:36px}
.B .hint{margin-top:14px;font-size:14px;color:var(--mute)}
.B .opts{margin-top:30px;display:flex;flex-direction:column;gap:2px}
.B .o{display:flex;align-items:center;gap:16px;padding:14px 4px;border-radius:14px}
.B .o b{font-size:17px}.B .o span{font-size:14px;color:var(--mute);display:block;margin-top:2px}
.B .o .ar{margin-left:auto;color:#c5cbd3;font-size:22px}
.B .r{background:var(--bg);padding:64px 72px 0;display:flex;flex-direction:column;gap:16px}
.B .r .hd{font-size:15px;font-weight:700;color:var(--mute)}
.run{background:#fff;border-radius:24px;padding:26px 28px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.run .t{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);font-weight:600}
.run h3{font-size:21px;margin-top:10px}
.st{display:flex;align-items:flex-start;gap:14px;margin-top:20px}
.st .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.st .k.ok{background:#e5f8ef;color:var(--green)}.st .k.now{background:var(--blue);color:#fff}.st .k.w{background:var(--line);color:var(--mute)}
.st b{font-size:16px}.st span{display:block;font-size:14px;color:var(--mute);margin-top:3px}
.st.wt b{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:22px;overflow:hidden}.bar i{display:block;height:100%;width:62%;background:var(--blue);border-radius:9px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini .run h3{font-size:26px;margin-top:6px}
.mini .run p{font-size:14px;color:var(--mute);margin-top:4px}

/* C */
.C{display:grid;grid-template-columns:300px 1fr 400px;height:100%}
.C .side{border-right:1px solid var(--line);padding:28px 20px}
.C .side h4{font-size:13px;color:var(--mute);font-weight:700;margin:4px 8px 12px}
.prj{border-radius:16px;padding:16px;margin-bottom:8px}
.prj.on{background:var(--blue2)}
.prj b{font-size:16px;display:block}.prj span{font-size:13px;color:var(--mute)}
.prj .pb{height:5px;background:#dbe3ec;border-radius:9px;margin-top:10px}.prj .pb i{display:block;height:100%;background:var(--blue);border-radius:9px}
.newp{border:1.5px dashed #d1d6db;border-radius:16px;padding:14px;text-align:center;color:var(--sub);font-weight:600;font-size:15px;margin-top:12px}
.C .mid{padding:36px 44px;overflow:hidden}
.C .mid .sub{font-size:15px;color:var(--mute);font-weight:600}
.C .mid h1{font-size:32px;font-weight:700;letter-spacing:-.8px;margin-top:6px}
.next{margin-top:24px;background:var(--ink);color:#fff;border-radius:24px;padding:26px 28px;display:flex;align-items:center;gap:20px}
.next .x{flex:1}.next small{font-size:14px;color:#8b95a1;font-weight:600}.next h3{font-size:21px;margin-top:6px}.next p{font-size:15px;color:#c5cbd3;margin-top:6px}
.next button{background:var(--blue);color:#fff;border:0;border-radius:14px;height:50px;padding:0 22px;font:700 16px Pretendard,'Malgun Gothic'}
.track{margin-top:28px}
.track .s{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.track .s:first-child{border-top:0}
.track .s b{font-size:17px}.track .s span{font-size:14px;color:var(--mute);display:block;margin-top:2px}
.track .s .rt{margin-left:auto;font-size:14px;font-weight:700}
.C .chat{background:var(--bg);border-left:1px solid var(--line);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.C .chat .hd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.msg{background:#fff;border-radius:18px 18px 18px 6px;padding:16px 18px;font-size:15px;line-height:1.6;color:var(--sub);box-shadow:0 4px 16px rgba(0,0,0,.04)}
.msg b{color:var(--ink)}
.msg.me{background:var(--blue);color:#fff;border-radius:18px 18px 6px 18px;align-self:flex-end;max-width:80%}
.act{display:flex;gap:8px;margin-top:12px}.act span{background:var(--blue2);color:var(--blue);font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px}
.act span.g{background:var(--line);color:var(--sub)}
.C .chat .ask{margin-top:auto;border-radius:16px;padding:8px 8px 8px 16px}.C .chat .ask input{font-size:15px}.C .chat .go{width:40px;height:40px;border-radius:12px}
</style></head>
<body>
<div class="top"><div class="logo">H</div><b>수소시설 인허가 가이드</b><span class="sp"></span><a>내 사업장</a><a>서류함</a><a>법령 찾기</a><div class="av"></div></div>
<main id="m"></main>
<div class="tag" id="tag"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'A';
const I = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  clip: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6b7684" stroke-width="2" stroke-linecap="round"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.3 3.3 0 014.7 4.7l-8.5 8.5a1.7 1.7 0 01-2.4-2.4L15.5 7"/></svg>',
  build: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>`,
  doc: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5M9 13l2 2 4-4"/></svg>`,
  map: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  swap: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>`,
  spark: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>`,
};
const ic = (svg, bg) => `<div class="ic" style="background:${bg}">${svg}</div>`;
const ask = ph => `<div class="ask"><div class="clip">${I.clip}</div><input placeholder="${ph}"><div class="go">${I.up}</div></div>`;
const M = {
A: ['시안 A', '할 일 고르기: 무엇을 하려는지 먼저 묻기', `
<div class="A">
  <span class="pill">${I.spark('#3182f6').replace('<svg', '<svg width="16" height="16"')} AI 인허가 에이전트</span>
  <h1>무엇을 준비하고 계세요?<br>나머지는 AI가 알아서 할게요</h1>
  <div class="lead">주소만 알려 주시면 허가 종류, 안전거리, 서류까지 한 번에 확인해 드려요</div>
  ${ask('예) 서울 강동구 천호대로에 수소충전소를 짓고 싶어요')}
  <div class="grid">
    <div class="c hl">${ic(I.build('#fff'), '#3182f6')}<h3>충전소 새로 짓기</h3><p>주소만 넣으면 부지를 3D로 보고, 신청서까지 채워 드려요</p><div class="steps">허가 판단 · 부지 검토 · 서류 작성 · 최종 점검</div></div>
    <div class="c">${ic(I.swap('#ff8a00'), '#fff3e0')}<h3>있는 시설 바꾸기</h3><p>설비 추가, 용량 증설, 위치 변경에 필요한 절차를 알려 드려요</p><div class="steps">변경허가 판단 · 바뀌는 서류</div></div>
    <div class="c">${ic(I.doc('#00b36b'), '#e5f8ef')}<h3>서류 검토 받기</h3><p>작성한 신청서와 배치도를 올리면 빠진 곳과 틀린 곳을 찾아요</p><div class="steps">빠진 항목 · 거리 기준 · 보완 요구 대비</div></div>
  </div>
  <div class="row"><span class="chip">충전소 허가 기간은?</span><span class="chip">학교 옆에 지을 수 있나요?</span><span class="chip">저장소 안전거리</span><span class="chip">실증특례 신청</span></div>
</div>`],
B: ['시안 B', '에이전트가 일하는 모습을 보여 주기', `
<div class="B">
  <div class="l">
    <span class="pill"><span class="dot"></span> AI 에이전트 대기 중</span>
    <h1>어디에 지으실 건가요?</h1>
    <div class="lead">주소 하나면 충분해요.<br>허가 종류부터 제출 전 점검까지 AI가 차례대로 해 드려요.</div>
    ${ask('주소를 입력하세요')}
    <div class="hint">배치도나 신청서가 있으면 함께 올려 주세요 (PDF, 그림)</div>
    <div class="opts">
      <div class="o">${ic(I.map('#3182f6'), '#e8f3ff')}<div><b>부지 3D 검토</b><span>주변 학교·주택까지 거리를 바로 재요</span></div><span class="ar">›</span></div>
      <div class="o">${ic(I.doc('#00b36b'), '#e5f8ef')}<div><b>신청서 자동 작성</b><span>공식 서식 16종, 칸을 대신 채워요</span></div><span class="ar">›</span></div>
      <div class="o">${ic(I.swap('#ff8a00'), '#fff3e0')}<div><b>법령 질문</b><span>법령·KGS Code 32,229조각에서 근거와 함께</span></div><span class="ar">›</span></div>
    </div>
  </div>
  <div class="r">
    <div class="hd">예시: 에이전트가 이렇게 일해요</div>
    <div class="run">
      <div class="t">${I.spark('#3182f6').replace('<svg', '<svg width="18" height="18"')} 서울 강동구 천호대로 · 수소충전소</div>
      <h3>허가 준비를 진행하고 있어요</h3>
      <div class="st"><div class="k ok">✓</div><div><b>허가 종류 판단</b><span>허가 대상, 담당 기관, 필요한 서류 확인</span></div></div>
      <div class="st"><div class="k ok">✓</div><div><b>부지 검토</b><span>주변 건물 11동 확인, 학교까지 221m (기준 17m)</span></div></div>
      <div class="st"><div class="k now">3</div><div><b>신청서 작성 중</b><span>16개 칸 중 13개 채움, 3개는 직접 확인 필요</span></div></div>
      <div class="st wt"><div class="k w">4</div><div><b>제출 전 최종 점검</b><span>빠진 서류, 거리 기준 다시 확인</span></div></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="mini">
      <div class="run"><div class="t">공식 서식</div><h3>16종</h3><p>칸을 대신 채워요</p></div>
      <div class="run"><div class="t">근거 법령</div><h3>32,229조각</h3><p>답마다 출처 번호</p></div>
    </div>
  </div>
</div>`],
C: ['시안 C', '내 사업장 진행판: 다음 할 일 하나만 크게', `
<div class="C">
  <div class="side">
    <h4>내 사업장</h4>
    <div class="prj on"><b>강동 수소충전소</b><span>저장식 · 신청서 작성 중</span><div class="pb"><i style="width:62%"></i></div></div>
    <div class="prj"><b>평택 출하센터</b><span>변경허가 · 서류 검토</span><div class="pb"><i style="width:30%"></i></div></div>
    <div class="newp">+ 새 사업장</div>
  </div>
  <div class="mid">
    <div class="sub">강동 수소충전소 · 서울 강동구 천호대로</div>
    <h1>허가 준비 62% 됐어요</h1>
    <div class="next">${ic(I.spark('#fff'), '#3182f6')}<div class="x"><small>다음 할 일</small><h3>신청서 빈칸 3개만 확인해 주세요</h3><p>AI가 13개를 채웠어요. 대표자 정보와 공사 기간은 직접 넣어야 해요</p></div><button>확인하기</button></div>
    <div class="track">
      <div class="s">${ic(I.build('#00b36b'), '#e5f8ef')}<div><b>허가 종류</b><span>허가 대상과 담당 기관 확인</span></div><span class="rt" style="color:#00b36b">완료</span></div>
      <div class="s">${ic(I.map('#00b36b'), '#e5f8ef')}<div><b>부지 3D 검토</b><span>안전거리 7가지 모두 통과</span></div><span class="rt" style="color:#00b36b">완료</span></div>
      <div class="s">${ic(I.doc('#3182f6'), '#e8f3ff')}<div><b>신청서 작성</b><span>16개 중 13개 채움</span></div><span class="rt" style="color:#3182f6">진행 중</span></div>
      <div class="s">${ic(I.doc('#b0b8c1'), '#f2f4f6')}<div><b>제출 전 최종 점검</b><span>신청서를 다 쓰면 자동으로 시작해요</span></div><span class="rt" style="color:#b0b8c1">대기</span></div>
    </div>
  </div>
  <div class="chat">
    <div class="hd">${I.spark('#3182f6').replace('<svg', '<svg width="18" height="18"')} AI 에이전트</div>
    <div class="msg">배치도를 읽어 보니 <b>저장설비와 충전기 사이가 4.4m</b>예요. 기준은 8m라 고쳐야 해요.<div class="act"><span>AI가 고치기</span><span class="g">방호벽 추가</span></div></div>
    <div class="msg me">고쳐 줘</div>
    <div class="msg">튜브트레일러를 4m 옮겨 <b>8.3m</b>로 맞췄어요. 7가지 기준 모두 통과예요.</div>
    ${ask('무엇이든 시켜 보세요')}
  </div>
</div>`],
};
document.getElementById('m').innerHTML = M[v][2];
document.getElementById('tag').innerHTML = `${M[v][0]}<small>${M[v][1]}</small>`;
document.body.dataset.ready = '1';
</script>
</body></html>

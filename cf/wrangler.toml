# 클라우드플레어 단독 배포(노트북·오라클 없이 돈다). 주소: hydrogen-guide.<계정>.workers.dev
# 자료는 export_cf.py 로 만들어 D1 에 넣는다. Gemini 키는 secret 으로 넣는다:
#   npx wrangler secret put GEMINI_API_KEY
name = "hydrogen-guide"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hydrogen-guide"
database_id = "16e522bc-b97e-4d14-b06e-439a754f6d2a"

# D1 한도가 바닥나면 오라클판(hydrogen-bot 워커 → 오라클 서버)으로 넘긴다. 같은 계정 워커끼리는 주소 대신 이 연결로 부른다.
[[services]]
binding = "BACKUP"
service = "hydrogen-bot"

# Gemini 는 일부 지역(예: 홍콩)에서 부르면 400 "User location is not supported" 로 막는다.
# 워커가 사용자 가까운 아무 데이터센터에서나 돌면 가끔 그 지역에서 나가므로, 서울 쪽에서 돌게 고정한다.
[placement]
mode = "targeted"
region = "gcp:asia-northeast3"

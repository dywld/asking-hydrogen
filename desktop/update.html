<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>업데이트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.55 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#191f28;background:#fff;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;user-select:none}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;width:100%;max-width:520px}
.logo{width:88px;height:88px;border-radius:28px;background:linear-gradient(140deg,#4593fc,#1b64da);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800;box-shadow:0 12px 30px rgba(49,130,246,.28);animation:float 3.2s ease-in-out infinite;position:relative}
.logo sub{font-size:16px;vertical-align:-4px}
.logo .new{position:absolute;top:-6px;right:-6px;background:#f04452;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 8px;border:3px solid #fff}
h1{font-size:30px;letter-spacing:-.6px;margin-top:28px}
.ver{margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:#f2f4f6;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;color:#4e5968}
.ver b{color:#3182f6}
.sub{margin-top:14px;font-size:16px;color:#6b7684}
.prog{width:100%;margin-top:34px;display:none}
.prog .bar{height:8px;background:#f2f4f6;border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:#3182f6;border-radius:9px;transition:width .25s}
.prog .t{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#6b7684;font-weight:600}
.bot{width:100%;max-width:520px;padding:10px 24px 28px}
button{width:100%;height:56px;border:0;border-radius:16px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.go{background:#3182f6;color:#fff}.go:hover{background:#1b64da}.go:active{transform:scale(.985)}
.later{background:#fff;color:#6b7684;margin-top:6px}.later:hover{background:#f2f4f6}
.busy .bot{visibility:hidden}.busy .prog{display:block}
.err{margin-top:16px;color:#e42939;font-size:14px;display:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style></head>
<body>
<div class="mid">
  <div class="logo"><span>H<sub>2</sub></span><span class="new">NEW</span></div>
  <h1>업데이트가 있어요!</h1>
  <div class="ver" id="ver"></div>
  <p class="sub" id="sub"></p>
  <div class="prog"><div class="bar"><i id="bar"></i></div><div class="t"><span id="pt">내려받는 중</span><span id="pp">0%</span></div></div>
  <p class="err" id="err"></p>
</div>
<div class="bot">
  <button class="go" id="go">업데이트하고 시작하기</button>
  <button class="later" id="later">나중에 할게요</button>
</div>
<script>
const q = new URLSearchParams(location.search), mode = q.get('mode'), v = q.get('v') || '', cur = q.get('cur') || '';
const U = window.h2app && window.h2app.update;
document.getElementById('ver').innerHTML = mode === 'app'
  ? `${cur ? cur + ' → ' : ''}<b>새 버전 ${v}</b>`
  : `<b>새 화면 ${v}</b>`;
document.getElementById('sub').textContent = mode === 'app'
  ? '내려받아 설치하면 앱이 저절로 다시 켜져요.'
  : '버튼을 누르면 새 화면으로 바로 시작해요.';
const $ = id => document.getElementById(id);
$('later').onclick = () => U && U.later();
$('go').onclick = () => {
  if (!U) return;
  if (mode === 'app') { document.body.classList.add('busy'); }
  else { $('go').textContent = '새 화면 불러오는 중'; $('go').disabled = true; }
  U.go();
};
if (U) {
  U.onProgress(p => { $('bar').style.width = p + '%'; $('pp').textContent = Math.floor(p) + '%'; });
  U.onState(s => {
    if (s === 'installing') { $('bar').style.width = '100%'; $('pp').textContent = '100%'; $('pt').textContent = '설치하고 다시 켜요'; }
    if (s.startsWith('error')) { document.body.classList.remove('busy'); $('err').style.display = 'block'; $('err').textContent = '업데이트를 받지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.'; }
  });
}
</script>
</body></html>

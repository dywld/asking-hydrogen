<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인터넷 연결 확인</title>
<style>
  :root { --ink: #1b2430; --ink-2: #5b6675; --accent: #2f6fed; --line: #e4e8ee; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #fff; color: var(--ink);
    font: 15.5px/1.65 Pretendard, "Malgun Gothic", system-ui, sans-serif; }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 16px; display: grid; place-items: center;
    background: linear-gradient(150deg, #6ea8ff, #2f6fed); color: #fff; font-weight: 700; font-size: 22px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--ink-2); margin: 0 0 20px; }
  button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px;
    padding: 10px 22px; cursor: pointer; }
  small { display: block; margin-top: 14px; color: var(--ink-2); font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">H</div>
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>법령 검색과 답변은 서버에서 받아 옵니다.<br>연결되면 아래 단추를 눌러 주세요.</p>
  <button id="retry">다시 연결</button>
  <small>사업장 폴더의 서류는 내 문서 &gt; 수소시설 인허가 가이드 에 그대로 있습니다.</small>
</div>
<script>
  const go = () => window.h2app && window.h2app.retry();
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script>
</body>
</html>

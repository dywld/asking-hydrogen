<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGS 서류 검토</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--blue:#3182f6;--navy:#0b3b7a;--red:#f04452;--redbg:#fff0f1;--org:#e67700;--orgbg:#fff8ec;--grn:#00a050;--grnbg:#e8faf0}
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}
.top b{font-size:17px}.top .crumb{font-size:14px;opacity:.85}.top a{color:#fff;text-decoration:none}
.top .demo{margin-left:auto;font-size:12px;background:#ffffff22;border-radius:12px;padding:4px 10px}
main{max-width:1240px;margin:0 auto;padding:22px 16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #0001}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpi div{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px #0001}
.kpi small{color:var(--sub)}.kpi b{display:block;font-size:28px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f5f6f8;text-align:left;padding:12px;color:var(--sub);font-weight:normal}
td{padding:13px 12px;border-bottom:1px solid #f2f4f6}
tr.row{cursor:pointer}tr.row:hover td{background:#f8fbff}
.pill{border-radius:20px;padding:3px 10px;font-size:12px;font-weight:bold;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)}.p-org{background:var(--orgbg);color:var(--org)}.p-grn{background:var(--grnbg);color:var(--grn)}.p-gray{background:#f2f4f6;color:var(--sub)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.paper{padding:26px 30px}.paper h2{text-align:center;font-size:19px;margin-bottom:6px}.paper .fn{text-align:center;color:var(--sub);font-size:12px;margin-bottom:16px}
.r{display:flex;border:1px solid #c9ced4;border-bottom:none;position:relative;font-size:14px}.r:last-of-type{border-bottom:1px solid #c9ced4}
.r span{width:150px;background:#f5f6f8;padding:9px;border-right:1px solid #c9ced4;flex:none}.r i{font-style:normal;padding:9px;flex:1;word-break:break-all}
.r.red{outline:3px solid var(--red);outline-offset:-3px;background:var(--redbg)}.r.org{outline:3px solid #ff9f1a;outline-offset:-3px;background:var(--orgbg)}
.r em{position:absolute;right:8px;top:8px;font-style:normal;color:#fff;font-size:12px;border-radius:10px;padding:1px 7px}
.r.red em{background:var(--red)}.r.org em{background:#ff9f1a}
.att{margin-top:16px;font-size:13px;color:var(--sub)}
.side{padding:22px}
.score{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.score b{font-size:30px}
.f{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.f .h{font-weight:bold;margin-bottom:2px}.f .law{color:var(--blue);font-size:12.5px;margin-top:2px}
.f.red{border-left:5px solid var(--red)}.f.org{border-left:5px solid #ff9f1a}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;border:none;cursor:pointer;border-radius:12px;padding:13px;font-weight:bold;font-size:15px;flex:1}
.b1{background:var(--blue);color:#fff}.b2{background:var(--redbg);color:var(--red)}.b3{background:#f2f4f6;color:var(--ink)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f2f4f6;font-size:14px}
.ck .s{width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;line-height:26px;font-weight:bold;flex:none}
textarea{width:100%;min-height:500px;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:14px;line-height:1.7;background:#fafbfc;resize:vertical}
.back{background:none;color:var(--blue);padding:0;flex:none;font-size:14px;margin-bottom:12px}
.done{padding:40px;text-align:center}.done .c{width:72px;height:72px;border-radius:50%;color:#fff;font-size:38px;line-height:72px;margin:0 auto 16px}
.h3{font-weight:bold;font-size:17px;margin-bottom:10px}
@media (max-width:820px){.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr}.hide-m{display:none}.r span{width:110px}}
.eff{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:linear-gradient(135deg,#0b3b7a,#1b64da);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
.eff small{opacity:.8;font-size:13px}.eff b{font-size:30px;margin-right:3px}.eff span{opacity:.85}
.eff .hl b{color:#9fe7c0}.eff p{grid-column:1/-1;font-size:12px;opacity:.7;margin-top:2px}
@media (max-width:820px){.eff{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="top"><b><a href="#">KGS 서류 검토</a></b><span class="crumb" id="crumb">접수함</span><span class="demo">시연판 · 실제 전산망과 연결되지 않음</span></div>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PILL = {'반려 예상':'p-red','확인 필요':'p-org','승인 가능':'p-grn','승인':'p-grn','보완 요청':'p-gray'};
const pill = t => `<span class="pill ${PILL[t]||'p-gray'}">${esc(t)}</span>`;
const api = (u, body) => fetch(u, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {}).then(r => r.json());

async function inbox() {
  $('#crumb').textContent = '접수함';
  const items = await api('/api/review/list');
  const wait = items.filter(x => x.status === '접수');
  const n = v => wait.filter(x => x.verdict === v).length;
  // 도입 효과 숫자판. 아낀 시간은 '반려 사유 1건을 사람이 찾는 데 10분'으로 잡은 추정치다(화면에 가정을 적는다).
  const reasons = items.reduce((t, x) => t + x.findings.filter(f => f.lv === 'red').length, 0);
  const autoRej = items.filter(x => x.verdict === '반려 예상').length;
  const mins = reasons * 10;
  const eff = `<div class="eff"><div><small>누적 접수</small><b data-n="${items.length}">0</b><span>건</span></div>`
    + `<div><small>자동 반려</small><b data-n="${autoRej}">0</b><span>건</span></div>`
    + `<div><small>AI가 찾은 반려 사유</small><b data-n="${reasons}">0</b><span>건</span></div>`
    + `<div class="hl"><small>아낀 검토 시간 (추정)</small><b data-n="${Math.round(mins / 6) / 10}" data-f="1">0</b><span>시간</span></div>`
    + `<p>추정: 반려 사유 1건을 사람이 찾는 데 10분으로 계산 · 시연 데이터 기준</p></div>`;
  $('#app').innerHTML = eff + `<div class="kpi"><div><small>반려 예상</small><b style="color:var(--red)">${n('반려 예상')}건</b></div>`
    + `<div><small>확인 필요</small><b style="color:var(--org)">${n('확인 필요')}건</b></div>`
    + `<div><small>승인 가능</small><b style="color:var(--grn)">${n('승인 가능')}건</b></div></div>`
    + `<div class="card" style="padding:8px 14px 14px"><table><tr><th>자동 판정</th><th>접수번호</th><th>신청인</th><th class="hide-m">종류</th><th class="hide-m">찾은 문제</th><th>상태</th></tr>`
    + items.map(x => `<tr class="row" data-id="${esc(x.id)}"><td>${pill(x.verdict)}</td><td>${esc(x.id)}</td><td>${esc(x.vals.company || '-')}${x.demo ? ' <small style="color:var(--sub)">(예시)</small>' : ''}</td>`
      + `<td class="hide-m">${esc(x.title)}</td><td class="hide-m">${x.findings.length ? esc(x.findings.slice(0,2).map(f=>f.title).join(', ')) + (x.findings.length>2?` 외 ${x.findings.length-2}건`:'') : '문제 없음'}</td>`
      + `<td>${x.status === '접수' ? `<small>${esc(x.time)} 접수</small>` : pill(x.status)}</td></tr>`).join('')
    + `</table>${items.length ? '' : '<p style="padding:20px;color:var(--sub)">접수된 신청서가 없습니다.</p>'}</div>`
    + `<p style="color:var(--sub);font-size:13px;margin-top:12px">빨간 것부터 위에 놓았습니다. 줄을 누르면 상세 검토로 갑니다.</p>`;
  // 숫자가 0부터 올라가는 모션(0.8초)
  document.querySelectorAll('.eff b[data-n]').forEach(b => {
    const to = +b.dataset.n, f = b.dataset.f ? 1 : 0, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - k, 3);
      b.textContent = (to * e).toFixed(f); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll('tr.row').forEach(r => r.onclick = () => location.hash = 'item/' + r.dataset.id);
}

async function detail(id) {
  const x = await api('/api/review/item?id=' + encodeURIComponent(id));
  if (x.error) { $('#app').textContent = x.error; return; }
  $('#crumb').textContent = `접수함 › ${x.id} ${x.vals.company || ''}`;
  const byKey = {}; x.findings.forEach((f, i) => { if (!byKey[f.key]) byKey[f.key] = {lv: f.lv, n: []}; byKey[f.key].n.push(i + 1); if (f.lv === 'red') byKey[f.key].lv = 'red'; });
  const labels = await fieldLabels(x.fid);
  const reds = x.findings.filter(f => f.lv === 'red').length, orgs = x.findings.length - reds;
  const color = reds ? 'var(--red)' : orgs ? 'var(--org)' : 'var(--grn)', bg = reds ? 'var(--redbg)' : orgs ? 'var(--orgbg)' : 'var(--grnbg)';
  $('#app').innerHTML = `<button class="back" onclick="location.hash=''">‹ 접수함</button><div class="two">`
    + `<div class="card paper"><h2>${esc(x.title)} 신청서</h2><div class="fn">접수 ${esc(x.date)} ${esc(x.time)} · ${esc(x.id)}</div>`
    + labels.map(([k, l]) => { const b = byKey[k]; return `<div class="r ${b ? b.lv : ''}"><span>${esc(l)}</span><i>${esc(x.vals[k]) || '<span style="color:var(--sub)">(빈칸)</span>'}</i>${b ? `<em>${b.n.join('·')}</em>` : ''}</div>`; }).join('')
    + `<div class="att"><b>첨부</b> ${x.docs.length ? x.docs.map(d => {
        // 올린 파일이 있는 서류는 눌러서 연다
        const fl = (x.files || []).filter(f => f.doc === d);
        return fl.length ? fl.map(f => `<a href="/api/review/file?k=${encodeURIComponent(f.k)}" target="_blank" rel="noopener">📎 ${esc(d)}</a>`).join(' · ') : esc(d);
      }).join(' · ') : '없음'}</div></div>`
    + `<div class="card side"><div class="score" style="background:${bg}"><b style="color:${color}">${x.findings.length}건</b><div>${x.findings.length ? '자동 검토가 확인이 필요한 곳을 찾았습니다' : '형식·첨부서류 문제가 없습니다'}<br><small style="color:var(--sub)">반려 사유 ${reds} · 확인 권장 ${orgs}</small></div></div>`
    + x.findings.map((f, i) => `<div class="f ${f.lv}"><div class="h">${i + 1}. ${esc(f.title)}</div>${esc(f.why)}<div class="law">근거: ${esc(f.basis)}</div></div>`).join('')
    + (x.status === '접수' ? `<div class="btns"><button class="b2" id="sup">보완 요청 공문 쓰기</button><button class="b1" id="ok">승인</button></div>`
      : `<p style="margin-top:14px">처리 결과: ${pill(x.status)}</p>`)
    + `<p style="color:var(--sub);font-size:12.5px;margin-top:12px">자동 검토는 형식·빈칸·첨부서류만 봅니다. 기술 기준 판단은 담당자가 합니다.</p></div></div>`;
  if ($('#sup')) $('#sup').onclick = () => location.hash = 'letter/' + x.id;
  if ($('#ok')) $('#ok').onclick = async () => { await api('/api/review/decide', {id: x.id, action: 'approve'}); finish(x, '승인'); };
}

const _labels = {};
async function fieldLabels(fid) {
  // 서식 칸 이름은 챗봇이 쓰는 서식 목록(/api/permit/forms)에서 가져온다.
  if (!_labels[fid]) {
    const forms = await api('/api/permit/forms');
    forms.forEach(f => _labels[f.id] = f.fields.map(t => [t.key, t.q.split(' (')[0]]));
  }
  return _labels[fid] || [];
}

async function letterView(id) {
  const x = await api('/api/review/item?id=' + encodeURIComponent(id));
  $('#crumb').textContent = `접수함 › ${x.id} › 보완 요청`;
  const labels = await fieldLabels(x.fid);
  const bad = {}; x.findings.forEach(f => { if (!bad[f.key] || f.lv === 'red') bad[f.key] = f; });
  const row = (lv, t, sub) => `<div class="ck"><div class="s" style="background:${lv==='red'?'var(--red)':lv==='org'?'#ff9f1a':'var(--grn)'}">${lv==='red'?'✕':lv==='org'?'!':'✓'}</div><div><b>${esc(t)}</b>${sub?`<br><small style="color:var(--sub)">${esc(sub)}</small>`:''}</div></div>`;
  $('#app').innerHTML = `<button class="back" onclick="location.hash='item/${esc(x.id)}'">‹ 상세 검토</button><div class="two">`
    + `<div class="card side"><div class="h3">검토 체크리스트</div>`
    + labels.map(([k, l]) => bad[k] ? row(bad[k].lv, l, bad[k].title) : row('ok', l)).join('')
    + (bad.docs ? x.findings.filter(f => f.key === 'docs').map(f => row('red', '첨부서류', f.title)).join('') : row('ok', '첨부서류'))
    + `</div><div class="card side"><div class="h3">보완 요청 공문 초안 <span class="pill p-grn">자동 작성</span></div>`
    + `<textarea id="lt">${esc(x.letter)}</textarea><div class="btns"><button class="b3" onclick="location.hash='item/${esc(x.id)}'">취소</button><button class="b1" id="send">보완 요청 발송</button></div>`
    + `<p style="color:var(--sub);font-size:12.5px;margin-top:10px">내용을 고친 뒤 발송할 수 있습니다. 시연판이라 실제로 보내지 않고 신청인 화면에 상태만 바뀝니다.</p></div></div>`;
  $('#send').onclick = async () => { await api('/api/review/decide', {id: x.id, action: 'supplement', letter: $('#lt').value}); finish(x, '보완 요청'); };
}

function finish(x, st) {
  const ok = st === '승인';
  $('#app').innerHTML = `<div class="card done"><div class="c" style="background:${ok ? 'var(--grn)' : 'var(--blue)'}">${ok ? '✓' : '✉'}</div>`
    + `<div class="h3" style="font-size:22px">${ok ? '승인했습니다' : '보완 요청을 보냈습니다'}</div><p style="color:var(--sub)">${esc(x.id)} · ${esc(x.vals.company || '')} · ${esc(x.title)}</p>`
    + `<div class="btns" style="max-width:360px;margin:22px auto 0"><button class="b1" onclick="location.hash=''">접수함으로</button></div></div>`;
}

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('item/')) detail(h.slice(5));
  else if (h.startsWith('letter/')) letterView(h.slice(7));
  else inbox();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body></html>
